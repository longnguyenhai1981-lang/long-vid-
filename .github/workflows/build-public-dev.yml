name: Build Motily public dev channel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bootstrap/phase50-overlay/**'
      - '.github/workflows/build-public-dev.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify Phase 50 overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/motily
          cat bootstrap/phase50-overlay/part{00..09}.b64 > /tmp/motily/phase50-overlay.b64
          base64 -d /tmp/motily/phase50-overlay.b64 > /tmp/motily/phase50-overlay.tar.xz
          echo '44aeb0e00dfaec46784fbc4ccdff4980f4c08b991f1cac2c1181acd51a683d86  /tmp/motily/phase50-overlay.tar.xz' | sha256sum -c -
          tar -tJf /tmp/motily/phase50-overlay.tar.xz >/tmp/motily/overlay-files.txt

      - name: Assemble Phase 50 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-public
          mkdir -p build-public/source
          cp -a app build-public/source/
          cp pyproject.toml build-public/source/
          [ -d scripts ] && cp -a scripts build-public/source/ || true
          [ -d ti_assets_v1 ] && cp -a ti_assets_v1 build-public/source/ || true
          [ -f README.md ] && cp README.md build-public/source/ || true
          [ -d docs ] && cp -a docs build-public/source/ || true

          tar -xJf /tmp/motily/phase50-overlay.tar.xz -C build-public/source

          if [ -f build-public/source/__DELETE__.txt ]; then
            while IFS= read -r rel || [ -n "$rel" ]; do
              [ -z "$rel" ] && continue
              case "$rel" in
                /*|../*|*/../*|*\\*) echo "Unsafe delete path: $rel" >&2; exit 1 ;;
              esac
              rm -rf -- "build-public/source/$rel"
            done < build-public/source/__DELETE__.txt
            rm -f build-public/source/__DELETE__.txt
          fi

          find build-public/source -type d -name '__pycache__' -prune -exec rm -rf {} +
          find build-public/source -type f -name '*.pyc' -delete
          rm -rf build-public/source/.pytest_cache build-public/source/data

          test -f build-public/source/app/studio/update_channel.py
          test -f build-public/source/app/studio/web.py
          grep -q 'PublicManifestUpdateChannel' build-public/source/app/studio/web.py
          grep -q 'fastapi' build-public/source/pyproject.toml
          python -m compileall -q build-public/source/app

      - name: Build runtime and Windows installer ZIPs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads updates/dev
          rm -f downloads/MotilyStudio_Runtime_v0.1-dev.zip downloads/MotilyStudio_PublicInstall_v0.1-dev.zip

          mkdir -p build-public/runtime/MotilyStudio_Runtime
          cp -a build-public/source/app build-public/runtime/MotilyStudio_Runtime/
          cp build-public/source/pyproject.toml build-public/runtime/MotilyStudio_Runtime/
          [ -d build-public/source/scripts ] && cp -a build-public/source/scripts build-public/runtime/MotilyStudio_Runtime/ || true
          [ -d build-public/source/ti_assets_v1 ] && cp -a build-public/source/ti_assets_v1 build-public/runtime/MotilyStudio_Runtime/ || true
          [ -f build-public/source/README.md ] && cp build-public/source/README.md build-public/runtime/MotilyStudio_Runtime/ || true
          (cd build-public/runtime && zip -qr "$GITHUB_WORKSPACE/downloads/MotilyStudio_Runtime_v0.1-dev.zip" MotilyStudio_Runtime)
          unzip -tq downloads/MotilyStudio_Runtime_v0.1-dev.zip

          INSTALL_ROOT='build-public/install/MotilyStudio_PublicInstall'
          mkdir -p "$INSTALL_ROOT"
          cp -a build-public/source/app "$INSTALL_ROOT/"
          cp build-public/source/pyproject.toml "$INSTALL_ROOT/"
          [ -d build-public/source/ti_assets_v1 ] && cp -a build-public/source/ti_assets_v1 "$INSTALL_ROOT/" || true
          [ -f build-public/source/README.md ] && cp build-public/source/README.md "$INSTALL_ROOT/" || true

          cat > "$INSTALL_ROOT/README_INSTALL.txt" <<'TXT'
          MOTILY STUDIO - DEVELOPMENT BUILD

          1. Double-click INSTALL.bat.
          2. Wait while Python dependencies are installed.
          3. Motily Studio will open in your browser.
          4. Future development builds can be installed from Studio using Check update -> Update & restart.

          Data is kept under %LOCALAPPDATA%\MotilyStudio\data and is not replaced by code updates.
          TXT

          cat > "$INSTALL_ROOT/INSTALL.bat" <<'BAT'
          @echo off
          setlocal EnableExtensions
          title Motily Studio Installer
          echo.
          echo ========================================
          echo          MOTILY STUDIO INSTALLER
          echo ========================================
          echo.

          set "INSTALL_DIR=%LOCALAPPDATA%\MotilyStudio"
          set "APP_DIR=%INSTALL_DIR%\app"
          set "VENV_DIR=%INSTALL_DIR%\.venv"

          if not exist "%INSTALL_DIR%" mkdir "%INSTALL_DIR%"
          if not exist "%INSTALL_DIR%\data" mkdir "%INSTALL_DIR%\data"

          echo [1/5] Copying Motily Studio...
          if exist "%APP_DIR%" rmdir /s /q "%APP_DIR%"
          xcopy /e /i /y "%~dp0app" "%APP_DIR%" >nul
          if exist "%INSTALL_DIR%\ti_assets_v1" rmdir /s /q "%INSTALL_DIR%\ti_assets_v1"
          if exist "%~dp0ti_assets_v1" xcopy /e /i /y "%~dp0ti_assets_v1" "%INSTALL_DIR%\ti_assets_v1" >nul
          copy /y "%~dp0pyproject.toml" "%INSTALL_DIR%\pyproject.toml" >nul

          echo [2/5] Finding Python 3.11+...
          set "PY_CMD="
          py -3.12 -c "import sys" >nul 2>&1 && set "PY_CMD=py -3.12"
          if not defined PY_CMD py -3.11 -c "import sys" >nul 2>&1 && set "PY_CMD=py -3.11"
          if not defined PY_CMD python -c "import sys; raise SystemExit(0 if sys.version_info >= (3,11) else 1)" >nul 2>&1 && set "PY_CMD=python"
          if not defined PY_CMD (
            echo Python 3.11+ was not found. Trying winget Python 3.12 installation...
            where winget >nul 2>&1 || goto :python_fail
            winget install --id Python.Python.3.12 -e --accept-source-agreements --accept-package-agreements
            py -3.12 -c "import sys" >nul 2>&1 && set "PY_CMD=py -3.12"
          )
          if not defined PY_CMD goto :python_fail

          echo [3/5] Creating isolated environment...
          if not exist "%VENV_DIR%\Scripts\python.exe" %PY_CMD% -m venv "%VENV_DIR%"
          if errorlevel 1 goto :fail
          "%VENV_DIR%\Scripts\python.exe" -m pip install --upgrade pip
          if errorlevel 1 goto :fail
          pushd "%INSTALL_DIR%"
          "%VENV_DIR%\Scripts\python.exe" -m pip install -e .
          if errorlevel 1 (popd & goto :fail)
          popd

          echo [4/5] Checking FFmpeg...
          where ffmpeg >nul 2>&1
          if errorlevel 1 (
            where winget >nul 2>&1 && winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements
          )

          echo [5/5] Creating launcher...
          >"%INSTALL_DIR%\START_MOTILY_STUDIO.cmd" echo @echo off
          >>"%INSTALL_DIR%\START_MOTILY_STUDIO.cmd" echo cd /d "%%LOCALAPPDATA%%\MotilyStudio"
          >>"%INSTALL_DIR%\START_MOTILY_STUDIO.cmd" echo "%%LOCALAPPDATA%%\MotilyStudio\.venv\Scripts\python.exe" -m app.cli.main studio

          powershell -NoProfile -ExecutionPolicy Bypass -Command "$w=New-Object -ComObject WScript.Shell; $s=$w.CreateShortcut([Environment]::GetFolderPath('Desktop')+'\Motily Studio.lnk'); $s.TargetPath='%INSTALL_DIR%\START_MOTILY_STUDIO.cmd'; $s.WorkingDirectory='%INSTALL_DIR%'; $s.Save()" >nul 2>&1

          echo.
          echo Installation complete.
          echo Opening Motily Studio...
          start "" "%INSTALL_DIR%\START_MOTILY_STUDIO.cmd"
          exit /b 0

          :python_fail
          echo.
          echo ERROR: Python 3.11+ could not be installed or found.
          pause
          exit /b 1

          :fail
          echo.
          echo ERROR: Motily Studio installation failed.
          pause
          exit /b 1
          BAT

          (cd build-public/install && zip -qr "$GITHUB_WORKSPACE/downloads/MotilyStudio_PublicInstall_v0.1-dev.zip" MotilyStudio_PublicInstall)
          unzip -tq downloads/MotilyStudio_PublicInstall_v0.1-dev.zip

      - name: Publish update manifest
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_SHA="$(sha256sum downloads/MotilyStudio_Runtime_v0.1-dev.zip | awk '{print $1}')"
          RUNTIME_SIZE="$(stat -c%s downloads/MotilyStudio_Runtime_v0.1-dev.zip)"
          INSTALL_SHA="$(sha256sum downloads/MotilyStudio_PublicInstall_v0.1-dev.zip | awk '{print $1}')"
          INSTALL_SIZE="$(stat -c%s downloads/MotilyStudio_PublicInstall_v0.1-dev.zip)"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > updates/dev/latest.json <<EOF
          {
            "schema_version": 1,
            "channel": "dev",
            "version": "0.1.0-dev",
            "revision": "$RUNTIME_SHA",
            "sha256": "$RUNTIME_SHA",
            "size_bytes": $RUNTIME_SIZE,
            "published_at": "$NOW",
            "download_url": "https://raw.githubusercontent.com/longnguyenhai1981-lang/long-vid-/main/downloads/MotilyStudio_Runtime_v0.1-dev.zip",
            "installer_url": "https://raw.githubusercontent.com/longnguyenhai1981-lang/long-vid-/main/downloads/MotilyStudio_PublicInstall_v0.1-dev.zip",
            "installer_sha256": "$INSTALL_SHA",
            "installer_size_bytes": $INSTALL_SIZE,
            "release_url": "https://github.com/longnguyenhai1981-lang/long-vid-/tree/main/updates/dev"
          }
          EOF
          echo "Runtime:   $RUNTIME_SIZE bytes  $RUNTIME_SHA"
          echo "Installer: $INSTALL_SIZE bytes  $INSTALL_SHA"

      - name: Commit generated dev build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/MotilyStudio_Runtime_v0.1-dev.zip downloads/MotilyStudio_PublicInstall_v0.1-dev.zip updates/dev/latest.json
          if git diff --cached --quiet; then
            echo 'No build changes to publish.'
            exit 0
          fi
          git commit -m 'Publish Motily public dev build'
          git push
