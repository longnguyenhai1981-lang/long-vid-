[project]
name = "motily"
version = "0.1.0"
description = "Mot Ti Ly AI content pipeline - Phase 1 typed contracts"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0",
    "SQLAlchemy>=2.0,<3.0",
    "google-genai>=2.0,<3.0",
    "httpx>=0.24,<1.0",
    "Pillow>=11.0,<13.0",
    "typer>=0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
motily = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_tts: makes a real network call to the Gemini TTS API; skipped unless RUN_LIVE_GEMINI_TTS=1 (see tests/test_gemini_tts_live_smoke.py)",
    "live_image: makes a real network call to the Gemini Image API; skipped unless RUN_LIVE_GEMINI_IMAGE=1 (see tests/test_gemini_image_live_smoke.py)",
    "live_cloudflare_image: makes a real network call to the Cloudflare Workers AI image API; skipped unless RUN_LIVE_CLOUDFLARE_IMAGE=1 (see tests/test_cloudflare_image_live_smoke.py)",
]
